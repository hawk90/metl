# Blank issues are off: a report without a version, a compiler and a reproducer
# usually costs a round of questions before anyone can look at it.
blank_issues_enabled: false
contact_links:
  - name: Security vulnerability (report privately)
    url: https://github.com/hawk90/metl/security/advisories/new
    about: >-
      Memory-safety defects reachable through a contract-valid API. Please do
      not open a public issue; see SECURITY.md for what counts and what to send.
  - name: Which container should I use?
    url: https://github.com/hawk90/metl/blob/main/docs/CHOOSING.md
    about: Trade-offs, invalidation rules and costs of every container.
