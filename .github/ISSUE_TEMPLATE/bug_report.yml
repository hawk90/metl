name: Bug report
description: Something in METL behaves differently from what its documentation says.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. An abort from a **documented precondition** (pushing past
        capacity, popping an empty container, `value()` on an empty `optional`) is the
        intended fail-fast behaviour -- use the `try_*` form for a non-aborting path.
        A memory-safety problem reachable through a contract-valid API is a
        **security issue**: please report it privately instead (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: METL version or commit
      description: "`metl::version_major/minor/patch`, a release tag, or a commit SHA."
      placeholder: 1.2.0
    validations:
      required: true
  - type: input
    id: compiler
    attributes:
      label: Compiler and flags
      description: Exact version and the flags that matter (`-std`, `-O`, `-fno-exceptions`, sanitizers).
      placeholder: arm-none-eabi-g++ 14.2, -std=c++17 -Os -fno-exceptions -fno-rtti
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Target
      description: Host OS, or MCU / board, RTOS (Zephyr, ESP-IDF, bare metal), C library.
      placeholder: Cortex-M4, bare metal, newlib-nano
    validations:
      required: true
  - type: dropdown
    id: hardening
    attributes:
      label: METL_HARDENING level
      options:
        - default (FAST, or DEBUG when NDEBUG is unset)
        - METL_HARDENING_DEBUG
        - METL_HARDENING_FAST
        - METL_HARDENING_NONE
    validations:
      required: true
  - type: textarea
    id: reproducer
    attributes:
      label: Minimal reproducer
      description: The smallest program that shows the problem. A godbolt.org link is welcome too.
      render: cpp
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual
      description: What you expected (cite the header or doc if you can), what happened, and any compiler or sanitizer output.
    validations:
      required: true
