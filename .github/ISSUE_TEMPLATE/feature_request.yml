name: Feature request
description: A new type, function or configuration for METL.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        METL's scope is decided by five invariants, not by "does it run on an MCU"
        ([docs/SCOPE.md](https://github.com/hawk90/metl/blob/main/docs/SCOPE.md)).
        A proposal that keeps all five is in scope; one that breaks any of them is not,
        however useful it is. SCOPE.md section 2 lists permanent rejections and
        section 5 the roadmap, so check both before proposing.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and why the existing types do not cover it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: Signatures and a short usage example.
      render: cpp
    validations:
      required: true
  - type: checkboxes
    id: invariants
    attributes:
      label: The invariants (docs/SCOPE.md section 1)
      description: Tick the ones the proposal keeps; explain any you cannot tick below.
      options:
        - label: "I1 -- no heap: no `malloc` / `operator new` reachable from the API"
        - label: "I2 -- no exceptions, no RTTI"
        - label: "I3 -- deterministic: every operation has a bounded worst case, and I can state it"
        - label: "I4 -- header-only C++17"
        - label: "I5 -- the header compiles on its own"
  - type: textarea
    id: bound
    attributes:
      label: Progress guarantee and cost
      description: "Wait-free bounded / lock-free / blocking bounded, and by what (e.g. `Capacity` comparisons). Flash or RAM cost if relevant."
  - type: textarea
    id: caller
    attributes:
      label: Who would call it
      description: SCOPE.md asks for a real caller -- an existing METL type, an example, or your own code.
