# West manifest for the `zephyr / qemu_cortex_m3` CI job (.github/workflows/ci.yml).
#
# Not a user-facing workspace: CI copies this file into a throwaway workspace
# and hands it to zephyrproject-rtos/action-zephyr-setup, which runs
# `west init -l` + `west update` on it. metl itself is NOT a project here; the
# job passes the checkout to Zephyr with -DEXTRA_ZEPHYR_MODULES, which is the
# integration path the sample documents.
#
# The allowlist keeps the update to what qemu_cortex_m3 needs (the CMSIS
# headers for Cortex-M), instead of every HAL in Zephyr's manifest.
# Renovate bumps `revision` (customManagers in renovate.json).
manifest:
  projects:
    - name: zephyr
      url: https://github.com/zephyrproject-rtos/zephyr
      revision: v4.4.2
      import:
        name-allowlist:
          - cmsis
          - cmsis_6
