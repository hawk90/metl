name: Scorecard

# OpenSSF Scorecard: an outside opinion on this repository's supply-chain
# posture, scored against checks this project does not get to define.
#
# WHY IT IS HERE AND WHAT IT IS NOT. Everything else in CI checks METL's own
# claims -- the API contract, the progress guarantees, the code size, the docs.
# Those are all self-authored, which is their strength (they encode decisions a
# generic tool cannot know) and their blind spot (a claim nobody made is a claim
# nobody checks). Scorecard is the opposite: eighteen checks written by people
# who have never read this code, several of which METL cannot influence from
# inside the repository at all.
#
# Treat the number as a diagnostic, not a target. A check that is wrong for a
# header-only library with no binary artifacts is wrong no matter what it scores,
# and the fix for that is to say so, not to contort the repository. What the run
# is genuinely good for is the checks nobody was tracking: an action that stopped
# being pinned, a workflow that gained a dangerous trigger, a dependency with a
# known advisory.
#
# NOT PUBLISHED BY DEFAULT. `publish_results: false` keeps the result inside this
# repository's Security tab. Setting it to `true` sends the score to the public
# OpenSSF API and is what enables the README badge -- a deliberate, outward-facing
# act, so it is a one-line change somebody makes on purpose rather than a default
# that shipped with the workflow. If you flip it, add `id-token: write` to the
# job permissions below; the action needs it to prove the result came from here.

on:
  branch_protection_rule:
  schedule:
    # Weekly. Scorecard's inputs move without this repository changing -- an
    # action's tag gets re-pointed, an advisory is published against a
    # dependency -- so a push-only trigger would report a stale posture.
    # Off-peak on a Monday, an hour after the CodeQL scan.
    - cron: '17 5 * * 1'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      # Required to upload the SARIF result to the Security tab.
      security-events: write
      # Required by the action to read workflow run metadata.
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # See the header comment. Flip to true only on purpose, and add
          # `id-token: write` above when you do.
          publish_results: false

      # Kept for 5 days so a run can be compared against the previous week's
      # without re-running it -- the score moving is the signal, not the score.
      - name: Upload the raw result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to the Security tab
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8
        with:
          sarif_file: results.sarif
