name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Single source of truth for the freestanding/embedded test sources that several
# cross jobs compile DIRECTLY (outside CMake). A tests/ move updates one place
# here instead of silently breaking N hard-coded compiler invocations.
env:
  METL_SMOKE_SRC: tests/embedded/embedded_smoke.cpp
  METL_SEMIHOST_SRC: tests/embedded/semihost_smoke.cpp
  METL_LINKER_SCRIPT: tests/embedded/mps2-an385.ld
  METL_ENDIAN_TEST: tests/bits/endian_test.cpp
  METL_INVARIANT_PROBE_SRC: tests/embedded/invariant_probe.cpp
  METL_INVARIANT_CANARY_SRC: tests/embedded/invariant_canary.cpp
  METL_LOCKFREE_CAP_SRC: tests/embedded/lockfree_capability.cpp

# Force bash for every run step so `set -o pipefail` and other bashisms work even
# inside container: jobs, where GitHub Actions otherwise falls back to dash and
# fails with "Illegal option -o pipefail" before any build runs.
defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # Preflight fast-gate — every other job `needs:` this, so a compile/test break
  # fails in ~3 min instead of spinning up the full cross-compile/sanitizer fleet
  # (fail-fast + cheaper CI). Intentionally a single fast Debug build+test.
  # ---------------------------------------------------------------------------
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install build deps
        uses: ./.github/actions/apt-install
        with:
          packages: build-essential clang
          cache-key: build-essential-clang

      - name: Quick Debug build + test (compile/test gate)
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug -DMETL_WARNINGS_AS_ERRORS=ON
          cmake --build build -j
          ctest --test-dir build -j --output-on-failure

  # ---------------------------------------------------------------------------
  # Host build & test matrix
  # ---------------------------------------------------------------------------
  host-test:
    name: host-test / ${{ matrix.os }} / ${{ matrix.compiler.cc || 'msvc' }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    needs: preflight
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        build_type: [Debug, Release, MinSizeRel]
        compiler:
          - { cc: gcc, cxx: g++ }
          - { cc: clang, cxx: clang++ }
        exclude:
          # macOS: only system clang
          - os: macos-14
            compiler: { cc: gcc, cxx: g++ }
          # Windows: MSVC only — skip both gcc and clang matrix entries
          - os: windows-latest
            compiler: { cc: gcc, cxx: g++ }
          - os: windows-latest
            compiler: { cc: clang, cxx: clang++ }

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        with:
          packages: build-essential clang clang-tools
          cache-key: build-essential-clang-clang-tools

      # macOS: nothing extra (system clang + cmake preinstalled on GH runners)
      # Windows: nothing extra (MSVC preinstalled on GH runners)

      - name: Configure (POSIX)
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Configure (Windows / MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build -j --config ${{ matrix.build_type }}

      - name: Test
        run: ctest --test-dir build -j --output-on-failure -C ${{ matrix.build_type }}

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: host-test-logs-${{ matrix.os }}-${{ matrix.compiler.cc || 'msvc' }}-${{ matrix.build_type }}
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Release + -Werror — gates warning hygiene in an optimized/NDEBUG build.
  #
  # Under NDEBUG, asserts (and their operands) compile out, so a variable used
  # only by an assert becomes -Wunused. The tests use CHECK/CHECK_EQ (which run
  # in Release too) precisely so this job stays green AND the assertions are
  # actually exercised in an optimized build. Complements the Debug-only
  # sanitizer/arm jobs, which never see the NDEBUG warning surface.
  # ---------------------------------------------------------------------------
  # clang only: GCC's extra Release/-Werror diagnostics here are known-noisy
  # (-Wclobbered on the setjmp assert test, -Wterminate/-Waddress/
  # -Wnull-dereference false positives), and GCC is already fully -Werror-gated
  # in Debug (sanitizers, arm-cross, examples). A dedicated gcc-Release-Werror
  # hardening pass is tracked separately.
  release-werror:
    name: release-werror / ${{ matrix.compiler.cc }}
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { cc: clang, cxx: clang++ }
          - { cc: gcc, cxx: g++ }

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install build deps
        uses: ./.github/actions/apt-install
        with:
          packages: build-essential clang
          cache-key: build-essential-clang

      - name: Configure (Release + warnings as errors)
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DMETL_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build -j --config Release

      - name: Test
        run: ctest --test-dir build -j --output-on-failure -C Release

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-werror-logs-${{ matrix.compiler.cc }}
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # LTO / IPO — link-time optimization must stay clean
  # ---------------------------------------------------------------------------
  lto:
    name: lto
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install build deps
        uses: ./.github/actions/apt-install
        with:
          packages: build-essential clang
          cache-key: build-essential-clang

      - name: Configure (Release + IPO)
        env:
          CC: clang
          CXX: clang++
        # No -Werror here: this job validates that the library builds & tests
        # pass under LTO/IPO, not warning hygiene (that's the sanitizer/arm jobs,
        # which run in Debug where asserts — and their operands — are live).
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build -j --output-on-failure

  # ---------------------------------------------------------------------------
  # Sanitizers (Linux + Clang, Debug, warnings-as-errors)
  # ---------------------------------------------------------------------------
  sanitizers:
    name: sanitizers / ${{ matrix.san }}
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - san: asan-ubsan
            opts: "-DMETL_ENABLE_ASAN=ON -DMETL_ENABLE_UBSAN=ON"
          - san: tsan
            opts: "-DMETL_ENABLE_TSAN=ON"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install build deps
        uses: ./.github/actions/apt-install
        with:
          packages: build-essential clang clang-tools
          cache-key: build-essential-clang-clang-tools

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMETL_WARNINGS_AS_ERRORS=ON \
            ${{ matrix.opts }}

      - name: Build
        run: cmake --build build -j --config Debug

      - name: Test
        env:
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1:abort_on_error=1"
          ASAN_OPTIONS: "halt_on_error=1:abort_on_error=1:detect_leaks=1"
        run: ctest --test-dir build -j --output-on-failure -C Debug

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: sanitizers-logs-${{ matrix.san }}
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # ARM cross-compile (Cortex-M family, compile + size only)
  # ---------------------------------------------------------------------------
  arm-cross:
    name: arm-cross / ${{ matrix.cpu }}
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cpu: [cortex-m0, cortex-m3, cortex-m4, cortex-m7]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install ARM toolchain
        uses: ./.github/actions/apt-install
        with:
          packages: gcc-arm-none-eabi
          cache-key: gcc-arm-none-eabi

      - name: Configure
        run: |
          cmake -B build-arm -S . \
            -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake \
            -DMETL_ARM_CPU=${{ matrix.cpu }} \
            -DMETL_BUILD_TESTS=OFF \
            -DMETL_BUILD_EMBEDDED_SMOKE=ON \
            -DMETL_INSTALL=OFF

      - name: Build
        run: cmake --build build-arm -j

      - name: Report code size
        run: arm-none-eabi-size build-arm/libmetl_embedded_smoke.a

      # Explicit MinSizeRel (-Os, NDEBUG) build so per-build binary size is
      # visible in the log. Informational only — no hard threshold yet; this is
      # the number to watch for size regressions over time.
      - name: Configure (MinSizeRel, -Os)
        run: |
          cmake -B build-arm-minsizerel -S . \
            -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake \
            -DMETL_ARM_CPU=${{ matrix.cpu }} \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DMETL_BUILD_TESTS=OFF \
            -DMETL_BUILD_EMBEDDED_SMOKE=ON \
            -DMETL_INSTALL=OFF

      - name: Build (MinSizeRel)
        run: cmake --build build-arm-minsizerel -j

      - name: Report MinSizeRel code size (informational)
        run: |
          echo "== MinSizeRel (-Os, NDEBUG) size — ${{ matrix.cpu }} =="
          arm-none-eabi-size build-arm-minsizerel/libmetl_embedded_smoke.a

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: arm-cross-logs-${{ matrix.cpu }}
          path: |
            build-arm/CMakeFiles/CMakeOutput.log
            build-arm/CMakeFiles/CMakeError.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Freestanding cross-frontend syntax checks (compile-only, no codegen/link).
  #
  # These jobs share an identical shape — checkout, apt-install a cross
  # toolchain, run ONE `-fsyntax-only` pass of the embedded smoke source over
  # the public headers — so they are collapsed into a single matrix. The only
  # per-target differences (compiler binary, target/arch flags, apt packages)
  # are expressed as matrix `include:` entries. Each entry's `name` is set as
  # the job `name`, which GitHub uses verbatim as the status-check name, so the
  # required checks "riscv-cross / rv64" and "arm-cross-clang / cortex-m4" are
  # preserved exactly despite the underlying job key changing.
  #
  # Targets:
  #   * riscv-cross / rv64      — Ubuntu's bare-metal gcc-riscv64-unknown-elf
  #     ships no libstdc++, so a full CMake cross-build isn't possible; instead
  #     the Linux-GNU RISC-V g++ (full libstdc++) does a freestanding
  #     -fsyntax-only pass, proving metl is portable to the RISC-V frontend.
  #   * arm-cross-clang / cortex-m4 — validates portability to a *different*
  #     compiler frontend (Clang) targeting bare-metal ARM. Clang has no
  #     freestanding C++ stdlib of its own, so it reuses gcc-arm-none-eabi's
  #     freestanding libstdc++ headers (search paths queried from the GCC driver
  #     and handed to clang as -isystem).
  # ---------------------------------------------------------------------------
  cross-syntax:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: riscv-cross / rv64
            apt_pkgs: g++-riscv64-linux-gnu
            compile_cmd: |
              set -euo pipefail
              riscv64-linux-gnu-g++ -std=c++17 -ffreestanding -fno-exceptions -fno-rtti \
                -Wall -Wextra -Iinclude -fsyntax-only "$METL_SMOKE_SRC"
          - name: arm-cross-clang / cortex-m4
            apt_pkgs: clang gcc-arm-none-eabi
            compile_cmd: |
              set -euo pipefail
              arm_flags="-mcpu=cortex-m4 -mthumb -mfloat-abi=soft"
              # Query the freestanding C++ header search paths from the GCC driver
              # so clang uses the same target standard library.
              mapfile -t GXX_INCS < <(arm-none-eabi-g++ ${arm_flags} -E -x c++ -v /dev/null 2>&1 | awk '/#include <...> search starts here:/{f=1;next} /End of search list/{f=0} f{sub(/^[ \t]+/,"");print}')
              ISYS=()
              for d in "${GXX_INCS[@]}"; do ISYS+=(-isystem "$d"); done
              echo "Using GCC target include dirs:"
              printf '  %s\n' "${GXX_INCS[@]}"
              clang++ --target=arm-none-eabi ${arm_flags} \
                -std=c++17 -ffreestanding -fno-exceptions -fno-rtti \
                -Wall -Wextra \
                "${ISYS[@]}" -Iinclude \
                -fsyntax-only "$METL_SMOKE_SRC"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install cross toolchain
        uses: ./.github/actions/apt-install
        with:
          packages: ${{ matrix.apt_pkgs }}
          cache-key: cross-${{ matrix.name }}

      - name: Syntax-only compile over the public headers
        run: ${{ matrix.compile_cmd }}

  # ---------------------------------------------------------------------------
  # Big-endian build — exercises endian.hpp on a real big-endian target.
  #
  # metl's byte-order logic is otherwise only ever compiled little-endian.
  # powerpc64-linux-gnu is a big-endian target whose GCC correctly defines
  # __BYTE_ORDER__ == __ORDER_BIG_ENDIAN__, so endian::native must resolve to
  # big. We (a) syntax-check every public header big-endian and (b) build and
  # RUN the endian test under qemu-user, whose byte-representation assertions
  # fail loudly if endian::native were mis-detected.
  # ---------------------------------------------------------------------------
  big-endian:
    name: big-endian / powerpc64
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install big-endian toolchain + qemu-user
        uses: ./.github/actions/apt-install
        with:
          packages: g++-powerpc64-linux-gnu qemu-user-static
          cache-key: powerpc64-qemu

      - name: Syntax-check every public header (big-endian frontend)
        run: |
          set -euo pipefail
          powerpc64-linux-gnu-g++ -std=c++17 -Wall -Wextra \
            -Iinclude -fsyntax-only "$METL_SMOKE_SRC"

      - name: Build the endian test (big-endian, static)
        run: |
          set -euo pipefail
          powerpc64-linux-gnu-g++ -std=c++17 -O2 -Wall -Wextra -static \
            -Iinclude "$METL_ENDIAN_TEST" -o endian_test_be

      - name: Run the endian test under qemu (big-endian)
        run: |
          set -euo pipefail
          qemu-ppc64-static ./endian_test_be
          echo "endian test passed on big-endian target"

  # ---------------------------------------------------------------------------
  # newlib-nano link — links metl against a real bare-metal libc (compile+link,
  # no run). Guaranteed-green baseline / fallback for the picolibc+QEMU run
  # below: proves the smoke program links against newlib-nano + nosys syscall
  # stubs on Cortex-M.
  # ---------------------------------------------------------------------------
  newlib-link:
    name: newlib-link / cortex-m3
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install ARM toolchain
        uses: ./.github/actions/apt-install
        with:
          packages: gcc-arm-none-eabi
          cache-key: gcc-arm-none-eabi

      - name: Link the smoke program against newlib-nano (nosys)
        run: |
          set -euo pipefail
          arm-none-eabi-g++ -std=c++17 -mcpu=cortex-m3 -mthumb -Os \
            -ffunction-sections -fdata-sections -fno-exceptions -fno-rtti \
            --specs=nano.specs --specs=nosys.specs -Wl,--gc-sections \
            -Iinclude "$METL_SEMIHOST_SRC" -o smoke_newlib.elf

      - name: Report code size
        run: arm-none-eabi-size smoke_newlib.elf

  # ---------------------------------------------------------------------------
  # Invariant gate — proves I1 (no heap), I2 (no exceptions / no RTTI) by
  # auditing the SYMBOL TABLE of a fully linked bare-metal image. See
  # docs/SCOPE.md section 7 for the design rationale; the short version:
  #
  #   * Symbol audit, not linker poisoning: the "make operator new reference an
  #     undefined symbol" trick depends on --gc-sections behaviour and differs
  #     between GNU ld, lld and IAR. Reading the final symbol table is
  #     linker-agnostic and proves all three properties in one pass.
  #   * The image is LINKED but never RUN, so no QEMU and no semihosting. A new
  #     target gets this gate with a cross toolchain alone.
  #   * --specs=rdimon.specs must NOT be used: its crt0 sets up the heap via the
  #     SYS_HEAPINFO semihosting call and is linked unconditionally, so heap
  #     symbols would enter the image with nothing to do with METL. nosys.specs
  #     is safe because libnosys is an archive — _sbrk only appears if something
  #     actually references it, which makes it a true positive.
  #   * -nostartfiles + our own _start: newlib's exit path (__call_exitprocs)
  #     can reach _malloc_r, which would redden the gate for a libc reason.
  #   * NO --gc-sections here (unlike the other cross jobs): section GC would
  #     hide an allocation sitting in a path no caller reaches.
  #   * The canary is mandatory. A gate that cannot fail is not a gate.
  # ---------------------------------------------------------------------------
  invariants:
    name: invariants / ${{ matrix.cpu }}
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cpu: [cortex-m0, cortex-m3, cortex-m4, cortex-m7]

    # Single source of truth for the link flags, so the probe and its negative
    # control cannot drift apart. Note the absence of -Wl,--gc-sections, which
    # the other cross jobs do use: section GC would hide an allocation living in
    # a path no caller reaches, and this gate wants everything the TU
    # instantiates to stay in the image.
    env:
      METL_LINK_FLAGS: >-
        -std=c++17 -mcpu=${{ matrix.cpu }} -mthumb -Os
        -ffunction-sections -fdata-sections -fno-exceptions -fno-rtti
        --specs=nano.specs --specs=nosys.specs -nostartfiles

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install ARM toolchain
        uses: ./.github/actions/apt-install
        with:
          packages: gcc-arm-none-eabi
          cache-key: gcc-arm-none-eabi

      - name: Link the invariant probe (newlib-nano, nosys, no crt0)
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086  # METL_LINK_FLAGS is a deliberate word list
          arm-none-eabi-g++ $METL_LINK_FLAGS -Wl,-Map=invariant_probe.map \
            -Iinclude "$METL_INVARIANT_PROBE_SRC" -o invariant_probe.elf

      - name: Audit the probe's symbol table
        run: |
          set -uo pipefail
          if python3 tools/check_invariants.py \
               --nm arm-none-eabi-nm invariant_probe.elf; then
            exit 0
          fi
          # A bare symbol list answers "what" but not "who pulled it in", and the
          # answer is usually an archive member two hops away (newlib's abort ->
          # raise -> signal table -> _malloc_r is the classic one). ld's map file
          # records exactly that chain, so print it rather than making the next
          # person re-derive it.
          echo "----- who pulled the offending archive members in -----"
          # Only the "Archive member included to satisfy reference by file"
          # section answers "who pulled it in". Terminating the range on the next
          # top-level section matters: this job links WITHOUT --gc-sections, so
          # ld emits no "Discarded input sections" and a naive range would run to
          # EOF, letting the grep match unrelated addresses in the memory map and
          # bury the one answer this diagnostic exists to give.
          awk '/^Archive member included/ {inside = 1}
               inside && /^(Allocating common symbols|Linker script and memory map|Memory Configuration)/ {inside = 0}
               inside' invariant_probe.map \
            | grep -B1 -E '_malloc|_free|_sbrk|_Znw|_Zna|_Unwind|__cxa' || true
          echo "-------------------------------------------------------"
          exit 1

      - name: Link the canary (deliberately violates the invariants)
        run: |
          set -euo pipefail
          # Same flags as the probe: the canary only differs in what the code
          # does, so a flag drift between the two would silently weaken the
          # negative control.
          # shellcheck disable=SC2086
          arm-none-eabi-g++ $METL_LINK_FLAGS \
            -Iinclude "$METL_INVARIANT_CANARY_SRC" -o invariant_canary.elf

      - name: Canary must FAIL the audit
        run: |
          set -uo pipefail
          if python3 tools/check_invariants.py \
               --nm arm-none-eabi-nm invariant_canary.elf; then
            echo "::error::the canary passed the invariant audit — the gate is dead"
            exit 1
          fi
          echo "canary correctly rejected; the audit can fail"

      # Code-size ratchet. This replaces an "(informational)" size print, which
      # is the same shape as bench-smoke: a step that can only pass.
      #
      # Size is the performance-ish number that CAN be gated here. docs/TODO.md
      # rejected a wall-clock threshold because "a threshold on a shared runner
      # either fires spuriously or never fires" -- true, and it does not apply to
      # a cross-compiled .text figure, which is a deterministic function of the
      # source and the toolchain. On a Cortex-M an unnoticed kilobyte matters
      # more than a percentage of throughput on a shared x86 runner anyway.
      #
      # The budgets are measured by THIS job and written down afterwards, never
      # taken from a local figure -- there is no ARM toolchain on the dev
      # machine, and even where a local one exists it has disagreed with CI
      # three times running. Same two-step as the clang-tidy ratchet.
      #
      # The numbers themselves are in tools/check_size.py and deliberately not
      # repeated here. They used to be, and when #66 raised them this comment
      # kept the old ones -- so the repository stated two answers to "what is the
      # Cortex-M0 budget" and the one a reader met first was wrong. check_docs.py
      # rule D5 now fails the build on any restatement, this one included.
      #
      # A budget can only go DOWN. If a toolchain bump moves these, re-measure
      # with --report and say so in the commit; do not pad.
      - name: Probe code-size ratchet must still bite (canary)
        run: tools/check_size.py --self-test

      # Gates .text AND .rodata now. .rodata had been measured and printed by
      # this very step since it was written, and compared against nothing --
      # the "step that can only pass" shape, inside the tool whose header
      # argues against it. It is not idle space either: #28 made CRC's nibble
      # table the default, which is a deliberate trade of .rodata for speed,
      # and a repository that gates one and not the other calls that trade free.
      - name: Probe code size (.text and .rodata) against its budgets
        run: |
          tools/check_size.py \
            --elf invariant_probe.elf \
            --cpu ${{ matrix.cpu }}

      # Stack-depth ratchet. The size ratchet above measures FLASH; this
      # measures what METL puts on the stack while it runs, which nothing here
      # has ever looked at. See tests/embedded/stack_probe.cpp for why it needs
      # its own probe rather than reusing invariant_probe.cpp: that one holds
      # capacity 4-8 containers, and the regression this guards against — an
      # operation that starts building into a local buffer — is invisible at
      # that size and kilobytes at a realistic one.
      #
      # Compiled, not linked. -fstack-usage is a compile-stage flag and writes
      # a .su file per TU, so there is nothing for a linker to contribute. The
      # flags mirror METL_LINK_FLAGS' compile half; the --specs= and
      # -nostartfiles entries are link-stage and deliberately absent.
      - name: Compile the stack probe with -fstack-usage
        run: |
          set -euo pipefail
          arm-none-eabi-g++ \
            -std=c++17 -mcpu=${{ matrix.cpu }} -mthumb -Os \
            -ffunction-sections -fdata-sections -fno-exceptions -fno-rtti \
            -fstack-usage \
            -Iinclude -c tests/embedded/stack_probe.cpp -o stack_probe.o

      - name: Stack ratchet must still bite (canary)
        run: tools/check_stack.py --self-test

      # Enforcing since #80. The budgets came from this job's own --report
      # output on #79 (run 32583708742) and never from a local figure — the same
      # two-step check_size.py used, for the same reason: there is no ARM
      # toolchain on the development machine and local numbers have disagreed
      # with CI repeatedly.
      #
      # The numbers themselves live in tools/check_stack.py and are deliberately
      # not repeated here; that is the mistake #76 fixed for the size budgets.
      - name: Probe stack depth against its budget
        run: |
          tools/check_stack.py \
            --su-dir . \
            --cpu ${{ matrix.cpu }}

      # Static RAM, the last unmeasured corner of the memory question. #77 pins
      # `sizeof` per container with static_assert and #79 measures the stack;
      # neither can see a hidden static inside a header, a function-local static
      # and its guard variable, or a table that moved from .rodata into .data.
      #
      # No new artifact: stack_probe.o was compiled two steps up, and that probe
      # already holds realistic-capacity containers in STATIC storage -- which is
      # exactly what a .bss ratchet needs. docs/TODO.md said a .bss ratchet had
      # no suitable probe, and that stopped being true when #79 landed.
      #
      # ENFORCING. The budgets came from this job's own --report output earlier
      # in this PR (run 32613760217), never from a local figure -- the numbers
      # themselves live in tools/check_size.py and are deliberately not repeated
      # here, which is the mistake #76 fixed for the size budgets.
      - name: Probe static RAM (.bss + .data) against its budget
        run: |
          tools/check_size.py \
            --ram-object stack_probe.o \
            --cpu ${{ matrix.cpu }}

  # ---------------------------------------------------------------------------
  # Tier 1 capability gate for METL's lock-free types — metl::atomic_handle and
  # metl::mpmc_queue (docs/SCOPE.md §3: a tier and its CI job arrive in the same
  # PR). Both gate on the same underlying question, so they share one probe.
  # The job keeps its original name so the status check stays stable.
  #
  # They need a lock-free single-word CAS. ARMv7-M and up have
  # LDREX/STREX; ARMv6-M (Cortex-M0/M0+) has no CAS, and GCC lowers atomic
  # read-modify-write there to libatomic calls. The matrix declares the expected
  # answer per target and the probe asserts it, so a toolchain change that moves
  # a target across that line fails HERE rather than silently changing METL's
  # progress guarantees.
  #
  # Both halves are required. Compiling only the supported targets would pass
  # just as happily if the capability trait were hardcoded true, so each job also
  # proves the OPPOSITE expectation does NOT compile -- the same reasoning as the
  # invariant canary.
  # ---------------------------------------------------------------------------
  handle-atomics:
    name: handle-atomics / ${{ matrix.cpu }}
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cpu: cortex-m0, lock_free: 0, opposite: 1 }  # ARMv6-M: no CAS
          - { cpu: cortex-m3, lock_free: 1, opposite: 0 }  # ARMv7-M: LDREX/STREX
          - { cpu: cortex-m4, lock_free: 1, opposite: 0 }
          - { cpu: cortex-m7, lock_free: 1, opposite: 0 }

    env:
      METL_CAP_FLAGS: >-
        -std=c++17 -mcpu=${{ matrix.cpu }} -mthumb -Os
        -fno-exceptions -fno-rtti -Wall -Wextra -Werror

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install ARM toolchain
        uses: ./.github/actions/apt-install
        with:
          packages: gcc-arm-none-eabi
          cache-key: gcc-arm-none-eabi

      - name: Capability must match what the matrix declares
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086  # METL_CAP_FLAGS is a deliberate word list
          arm-none-eabi-g++ $METL_CAP_FLAGS \
            -DMETL_EXPECT_LOCK_FREE_HANDLE=${{ matrix.lock_free }} \
            -Iinclude -c "$METL_LOCKFREE_CAP_SRC" -o capability.o
          echo "${{ matrix.cpu }}: lock-free handle atomics = ${{ matrix.lock_free }}, as declared"

      - name: The opposite expectation must NOT compile
        run: |
          set -uo pipefail
          # shellcheck disable=SC2086
          if arm-none-eabi-g++ $METL_CAP_FLAGS \
               -DMETL_EXPECT_LOCK_FREE_HANDLE=${{ matrix.opposite }} \
               -Iinclude -c "$METL_LOCKFREE_CAP_SRC" -o opposite.o 2>/dev/null; then
            echo "::error::the capability assertion did not fire for ${{ matrix.cpu }} — the gate is dead"
            exit 1
          fi
          echo "capability assertion correctly rejected the wrong expectation"

  # ---------------------------------------------------------------------------
  # picolibc + QEMU semihosting — the one job that goes beyond compile/link:
  # links the smoke program against picolibc for a Cortex-M (mps2-an385) with
  # semihosting and RUNS it under qemu-system-arm, asserting the success
  # sentinel. This proves metl links AND runs on a real embedded libc.
  #
  # picolibc + libstdc++ linking can be version-sensitive; if this job needs
  # iteration, the newlib-link job above is the guaranteed-green libc-link
  # proof (see docs/AUDIT.md task #7).
  # ---------------------------------------------------------------------------
  picolibc-qemu:
    name: picolibc-qemu / mps2-an385
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install ARM toolchain + picolibc + QEMU
        uses: ./.github/actions/apt-install
        with:
          packages: gcc-arm-none-eabi picolibc-arm-none-eabi qemu-system-arm
          cache-key: arm-picolibc-qemu

      - name: Link the smoke program against picolibc (semihosting)
        run: |
          set -euo pipefail
          arm-none-eabi-g++ --specs=picolibc.specs --oslib=semihost \
            -std=c++17 -mcpu=cortex-m3 -mthumb -Os \
            -ffunction-sections -fdata-sections -fno-exceptions -fno-rtti \
            -Wl,--gc-sections \
            -T "$METL_LINKER_SCRIPT" \
            -Iinclude "$METL_SEMIHOST_SRC" -o smoke_picolibc.elf

      - name: Report code size
        run: arm-none-eabi-size smoke_picolibc.elf

      - name: Run under qemu-system-arm (semihosting) and assert success
        run: |
          set -uo pipefail
          # The program emits the sentinel via semihosting; some machine +
          # semihosting combos don't cleanly SYS_EXIT, so tolerate a timeout and
          # let the sentinel grep decide pass/fail (the run itself is the proof).
          out="$(timeout 30 qemu-system-arm \
            -semihosting-config enable=on \
            -monitor none -serial none -nographic \
            -machine mps2-an385,accel=tcg \
            -kernel smoke_picolibc.elf 2>&1 || true)"
          echo "----- qemu output -----"
          echo "${out}"
          echo "-----------------------"
          echo "${out}" | grep -q METL_SEMIHOST_PASS

  # ---------------------------------------------------------------------------
  # Cortex-M conformance — the host test suite, cross-compiled and RUN on an
  # emulated Cortex-M3.
  #
  # This is the job that closes METL's largest gap between claim and proof. The
  # library's differentiator is that it is provably usable on bare metal, but
  # until this job the only thing ever executed on an MCU was one smoke program
  # covering seven headers (picolibc-qemu). Everything else — every container,
  # every queue, every vocabulary type — was compile-and-link only, with its
  # behaviour verified exclusively on x86/arm64 hosts.
  #
  # Deny-list, not allow-list. A curated set of "embedded-appropriate checks"
  # would silently miss every type added afterwards, which is the exact failure
  # mode docs/SCOPE.md §8 records for the invariant probe. Every test runs unless
  # tools/run_qemu_tests.sh excludes it with a stated reason.
  #
  # BLOCKING on purpose, and a timeout counts as a failure. The smoke job
  # tolerates a timeout because its proof is "the program ran at all"; a
  # conformance gate that cannot distinguish a hang from a pass is not a gate.
  #
  # The Cortex-M0 entry also asserts the capability gates: mpmc_queue,
  # atomic_handle and the atomic-refcounted intrusive_ptr MUST fail to compile
  # there, because ARMv6-M has no lock-free read-modify-write. If one of them
  # builds, the gate has silently stopped rejecting and the job fails -- the same
  # reasoning as the invariant canary.
  #
  # intrusive_ptr was added to that list by this job finding it: the atomic
  # counter used to fail at LINK time with `undefined reference to
  # __atomic_fetch_add_4` inside a mangled symbol. It is now a static_assert that
  # says what to use instead.
  # ---------------------------------------------------------------------------
  qemu-conformance:
    name: qemu-conformance / ${{ matrix.cpu }}
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpu: cortex-m3
            machine: mps2-an385
            expect_build_fail: ""
          - cpu: cortex-m4
            machine: mps2-an386
            expect_build_fail: ""
          - cpu: cortex-m7
            machine: mps2-an500
            expect_build_fail: ""
          # ARMv6-M code executed on the AN385's ARMv7-M core. QEMU has no
          # Cortex-M0 MPS2 board, and ARMv6-M is a strict subset, so the M0
          # BUILD runs here — which is what exercises the no-CAS paths, the
          # capability gates and the libgcc helpers an M0 build pulls in.
          #
          # Stated limit: this proves the M0 build runs, not that an M0 core runs
          # it. Anything where the core differs rather than the instruction set
          # (unaligned access, absent VTOR) is not covered, which is why
          # irq_masking_test skips itself on ARMv6-M rather than passing falsely.
          - cpu: cortex-m0
            machine: mps2-an385
            expect_build_fail: "sync/mpmc_queue_test.cpp,sync/atomic_handle_test.cpp,vocab/intrusive_ptr_test.cpp,sync/audit_regressions_test.cpp"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install ARM toolchain + picolibc + QEMU
        uses: ./.github/actions/apt-install
        with:
          packages: gcc-arm-none-eabi picolibc-arm-none-eabi qemu-system-arm
          cache-key: arm-picolibc-qemu

      - name: Confirm the machine model exists in this QEMU
        run: |
          if ! qemu-system-arm -machine help | grep -qE '^${{ matrix.machine }}\b'; then
            echo "::error::qemu-system-arm has no machine '${{ matrix.machine }}'"
            qemu-system-arm -machine help | head -40
            exit 1
          fi

      - name: Cross-compile and run the test suite on ${{ matrix.cpu }}
        run: |
          tools/run_qemu_tests.sh \
            --cpu ${{ matrix.cpu }} \
            --machine ${{ matrix.machine }} \
            --expect-build-fail '${{ matrix.expect_build_fail }}'

      - name: Upload build/run logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: qemu-conformance-logs-${{ matrix.cpu }}
          path: build-qemu-conformance/*.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Non-default configurations.
  #
  # Coverage tooling cannot see an #if arm that is never COMPILED — it reports on
  # the code the build actually produced, so a configuration nobody builds looks
  # like 100% covered code that has never existed. This job builds the ones the
  # rest of the pipeline does not.
  #
  # The list is deliberately short, because an audit of the configuration macros
  # found most of them already covered:
  #
  #   METL_HARDENING (NONE/FAST/DEBUG)  covered — tests/core/hardening_*_test.cpp
  #                                     each #define a level before including the
  #                                     shared body, so all three get compiled.
  #   METL_NO_EXCEPTIONS (0 and 1)      covered — the host test build has
  #                                     exceptions on, and qemu-conformance
  #                                     compiles everything -fno-exceptions.
  #   METL_CRC_TABLE (0)                NOT covered until now. Added with the
  #                                     nibble table; only the default (1) was
  #                                     ever built.
  #   C++20                             NOT covered until now, and it hid a test
  #                                     that could not fail: the static_asserts
  #                                     in optional_constexpr_test.cpp sit behind
  #                                     `#if __cplusplus >= 202002L`, so the file
  #                                     was green everywhere while verifying
  #                                     nothing. The claim it makes turns out to
  #                                     be true -- it just had never been checked.
  #
  # Adding a configuration here is one matrix line, which is the point of the job
  # existing for a single entry today.
  # ---------------------------------------------------------------------------
  config-matrix:
    name: config-matrix / ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: crc-table-off
            cmake_args: -DCMAKE_CXX_FLAGS=-DMETL_CRC_TABLE=0
          # C++20 was never compiled here until this entry existed, which meant
          # detail/construct.hpp's std::construct_at path -- and the
          # static_asserts in tests/vocab/optional_constexpr_test.cpp, which are
          # guarded by `#if __cplusplus >= 202002L` -- had never been built. That
          # test was green in every configuration while proving nothing.
          #
          # The baseline stays C++17. This leg only establishes that the C++20
          # arm of the dual-mode code compiles and passes, which is the
          # prerequisite for any decision about raising it.
          - name: cxx20
            cmake_args: -DCMAKE_CXX_STANDARD=20 -DCMAKE_CXX_STANDARD_REQUIRED=ON

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install build deps
        uses: ./.github/actions/apt-install
        with:
          packages: build-essential clang
          cache-key: build-essential-clang

      - name: Configure with ${{ matrix.cmake_args }}
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -B build-config -S . \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMETL_WARNINGS_AS_ERRORS=ON \
            -DMETL_INSTALL=OFF \
            ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build-config -j

      - name: Test
        run: ctest --test-dir build-config -j --output-on-failure

  # ---------------------------------------------------------------------------
  # Coverage (host, Clang source-based).
  #
  # Reports on include/metl only: llvm-cov's default total also counts the test
  # sources, which measures how well the tests cover themselves.
  #
  # Floors rather than a target. They sit below the measured numbers so the job
  # catches a regression instead of failing on noise, and they ratchet upward
  # deliberately, never automatically.
  #
  # Raised 85/70 -> 90/72 on 2026-08-21. The old floors had 6.2 and 4.7 points of
  # slack against the measured numbers, which means six points of line coverage
  # could have quietly rotted away and still passed -- a gate that only fires
  # after a collapse.
  #
  # The margins are DERIVED, not picked. Measured on the same tree:
  #
  #                 CI (Ubuntu)   local (macOS)   spread
  #     lines          91.22%        91.07%        0.15
  #     branches       74.67%        77.31%        2.64
  #
  # Line coverage barely moves between toolchains, so a 1.2-point margin is
  # plenty. Branch coverage moves 2.6 points -- llvm-cov versions disagree about
  # what counts as a branch -- so its margin is one observed spread wide. Only
  # the CI number gates; the local one is here to size the margin.
  #
  # What this number does NOT cover, stated here because a single percentage
  # invites the wrong conclusion:
  #   * `#if` arms this configuration does not compile -- config-matrix exists
  #     for those, since coverage cannot report on code that was never built.
  #   * Anything gated on being an MCU: irq_lock's PRIMASK path, the ARMv6-M
  #     capability rejections, the -fno-exceptions arms. Their evidence is
  #     qemu-conformance.
  #   * Anything evaluated at compile time. constexpr code exercised only by
  #     static_assert reads as uncovered lines; bit.hpp shows ~29% lines at 100%
  #     branches for that reason alone.
  # ---------------------------------------------------------------------------
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install build deps
        uses: ./.github/actions/apt-install
        with:
          packages: build-essential clang llvm
          cache-key: build-essential-clang-llvm

      - name: Measure
        env:
          CC: clang
          CXX: clang++
        run: tools/coverage.sh --min-lines 90 --min-branches 72

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: coverage-report
          path: build-coverage/report.txt
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Header hygiene — per-header self-containment + umbrella completeness
  # ---------------------------------------------------------------------------
  header-checks:
    name: header-checks
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install build deps
        uses: ./.github/actions/apt-install
        with:
          packages: build-essential clang
          cache-key: build-essential-clang

      # Direct implementation of the requirement: every header compiles as its
      # own translation unit in isolation with -std=c++17 -fsyntax-only.
      - name: Per-header self-containment (one TU per header, -fsyntax-only)
        env:
          CXX: clang++
        run: |
          fail=0
          while IFS= read -r -d '' h; do
            rel="${h#include/}"
            echo "checking ${rel}"
            printf '#include <%s>\n' "${rel}" \
              | "${CXX}" -std=c++17 -Wall -Wextra -Werror -Iinclude -fsyntax-only -x c++ - \
              || { echo "NOT SELF-CONTAINED: ${rel}"; fail=1; }
          done < <(find include/metl -name '*.hpp' -print0)
          exit "${fail}"

      # The same guarantees are also enforced through CMake/CTest so `ctest`
      # alone catches regressions on every host in the matrix.
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug -DMETL_WARNINGS_AS_ERRORS=ON

      - name: Build self-containment target
        run: cmake --build build -j --target metl_header_self_contained

      - name: Umbrella completeness + self-containment (CTest)
        run: ctest --test-dir build -R 'metl_umbrella_complete|metl_header_self_contained' --output-on-failure

  # ---------------------------------------------------------------------------
  # Recoverable-API contract (docs/SCOPE.md section 9)
  #
  # Exists because review already failed at this once. 22 of the 55 `try_*` entry
  # points shipped without METL_NODISCARD, and the split followed *when the header
  # was written*, not any principle: `fixed_vector::try_push_back(x);` compiled
  # silently while `fixed_queue::try_push(x);` warned — the same idiom, opposite
  # safety, in the same library. A one-time sweep fixes that once; this job is
  # what keeps it fixed.
  #
  # Two things are checked that a compiler cannot check for itself:
  #   * R3 (every `try_*` is METL_NODISCARD) and R2 (`try_` is reserved for the
  #     recoverable form) — a source scan with a reasoned allowlist for R4.
  #   * the forward-iterator requirement on try_assign/try_insert. It is a hard
  #     `static_assert` rather than an `enable_if`, deliberately: a named reason
  #     beats "no matching function". The cost is that it is not SFINAE-detectable,
  #     so the only way to prove it still fires is to compile the rejecting case
  #     and require failure — the same shape as the handle-atomics capability gate.
  #
  # `--self-test` runs the checker against fixtures that must be reported. A gate
  # that cannot fail is not a gate.
  # ---------------------------------------------------------------------------
  api-contract:
    name: api-contract
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install build deps
        uses: ./.github/actions/apt-install
        with:
          packages: build-essential clang
          cache-key: build-essential-clang

      - name: The checker must still bite (canary)
        run: tools/check_api_contract.py --self-test

      - name: R2/R3 hold across every public header
        run: tools/check_api_contract.py

      - name: The I3 checker must still bite (canary)
        run: tools/check_progress_guarantee.py --self-test

      - name: I3 progress guarantee stated in every public header
        run: tools/check_progress_guarantee.py

      - name: The docs checker must still bite (canary)
        run: tools/check_docs.py --self-test

      - name: Doc claims that a machine can settle
        run: tools/check_docs.py

      - name: A forward-iterator range is accepted
        run: |
          clang++ -std=c++17 -Wall -Wextra -Werror -Iinclude \
            -DMETL_ITERATOR_KIND=0 \
            -c tests/containers/forward_iterator_contract.cpp -o forward.o

      - name: A single-pass range must NOT compile
        run: |
          set -uo pipefail
          if clang++ -std=c++17 -Wall -Wextra -Werror -Iinclude \
               -DMETL_ITERATOR_KIND=1 \
               -c tests/containers/forward_iterator_contract.cpp -o input.o 2>/dev/null; then
            echo "::error::try_assign accepted a single-pass iterator — it can no longer"
            echo "::error::promise 'contents unchanged on failure'. The constraint is gone."
            exit 1
          fi
          echo "single-pass range correctly rejected at compile time"

  # ---------------------------------------------------------------------------
  # clang-tidy (blocking deduplicated ratchet)
  #
  # 142 is the distinct-finding count this exact job reported on this runner
  # (run 32393655273: 142 distinct, 521 raw). It replaces 148 (run 32274968429)
  # after `-modernize-concat-nested-namespaces` was disabled with its reason in
  # `.clang-tidy`. The budget can only go down; a new diagnostic fails this job.
  #
  # Note that the budget was NOT lowered in the same commit that caused the drop.
  # The commit that disabled the check left the ceiling at 148 deliberately, the
  # job reported 142, and only then was the number set from that report. Setting
  # it from the local run would have been wrong in both directions before: too
  # slack once (546 local vs 148 on CI), and the wrong *sign* once (a local delta
  # of -1 against a CI delta of +1).
  #
  # Do not set it from a local run. macOS/libc++ and Ubuntu/libstdc++ disagree
  # substantially even at the same clang-tidy version, and the versions differ
  # too (this image ships clang-tidy 18): locally this tree reports 472 distinct
  # and *zero* `modernize-type-traits`, where CI reported 739 and 308. A budget
  # taken from the local number would have been ~3.7x slack and blocked nothing.
  #
  # `--max` is a regression budget, not a defect count. The residue was triaged
  # (docs/TODO.md): the two checks that looked like real-bug candidates are
  # false positives here. If a runner image bumps clang-tidy, expect this number
  # to move -- re-measure rather than padding it.
  # ---------------------------------------------------------------------------
  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install toolchain
        uses: ./.github/actions/apt-install
        with:
          packages: build-essential clang clang-tidy
          cache-key: build-essential-clang-clang-tidy

      - name: Configure with compile commands
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy on public headers (deduplicated ratchet)
        run: tools/clang_tidy_report.sh -p build --max 142

  # ---------------------------------------------------------------------------
  # Single-header amalgamation
  #
  # The release artifact is generated from the real headers, so the only way it
  # can be wrong is if generation itself is wrong. This job proves it is not, by
  # the strongest check available: it redirects every `metl/*.hpp` to the
  # amalgamated file and builds and runs the entire test suite through it. A
  # missing declaration, a bad emission order or an include hoisted out of its
  # `#if` guard all fail here rather than in a user's tree.
  # ---------------------------------------------------------------------------
  amalgamation:
    name: amalgamation
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install build deps
        uses: ./.github/actions/apt-install
        with:
          packages: build-essential clang
          cache-key: build-essential-clang

      - name: Generate
        run: python3 tools/amalgamate.py -o metl-single.hpp

      - name: Build every test through the amalgamated header
        run: |
          mkdir -p shim
          cp metl-single.hpp shim/metl_amalgamated.hpp
          # One shim per public header, so an `#include "metl/x.hpp"` in a test
          # resolves to the amalgamation instead of the include directory.
          while read -r header; do
            mkdir -p "shim/$(dirname "${header}")"
            printf '#pragma once\n#include "metl_amalgamated.hpp"\n' > "shim/${header}"
          done < <(cd include && find metl -name '*.hpp')

          pass=0
          failed=()
          while read -r test; do
            if clang++ -std=c++17 -O1 -Wall -Wextra -Werror -pthread \
                 -I shim -I tests "${test}" -o /tmp/amal_bin && /tmp/amal_bin > /dev/null 2>&1; then
              pass=$(( pass + 1 ))
            else
              failed+=("${test}")
            fi
          done < <(find tests -name '*_test.cpp' -not -path 'tests/embedded/*')

          echo "${pass} tests passed through the amalgamated header"
          if (( ${#failed[@]} > 0 )); then
            printf 'FAILED: %s\n' "${failed[@]}" >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: metl-single-header
          path: metl-single.hpp

  # ---------------------------------------------------------------------------
  # Conan package
  #
  # Packaging breaks in ways the test suite cannot see: a header left out of the
  # copy, a target name that does not match what `find_package(metl)` provides,
  # a C++ standard requirement that is assumed rather than declared. This runs
  # `conan create`, which builds the recipe and then compiles and runs
  # `test_package/` against the *packaged* headers through `metl::metl`, and
  # then checks that a C++14 consumer is refused at configure time rather than
  # failing deep inside a header.
  # ---------------------------------------------------------------------------
  conan:
    name: conan
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install build deps
        uses: ./.github/actions/apt-install
        with:
          packages: build-essential
          cache-key: build-essential

      - name: Install Conan
        run: pipx install conan

      - name: Package and consume
        run: |
          conan profile detect --force
          conan create . --build=missing -s compiler.cppstd=17

      - name: A C++14 consumer must be refused
        run: |
          if conan create . --build=missing -s compiler.cppstd=14 > cxx14.log 2>&1; then
            echo "Expected the C++14 configuration to be rejected, but it succeeded." >&2
            exit 1
          fi
          grep -q "lower than the required C++ standard" cxx14.log || {
            echo "C++14 failed, but not with the cppstd validation error:" >&2
            tail -20 cxx14.log >&2
            exit 1
          }
          echo "C++14 correctly refused at validate() time."

  # ---------------------------------------------------------------------------
  # clang-format (strict — fails on any diff)
  # ---------------------------------------------------------------------------
  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install clang-format (pinned)
        run: pipx install clang-format==18.1.8

      - name: Check formatting
        run: |
          find include tests examples \( -name '*.hpp' -o -name '*.cpp' \) \
            | xargs clang-format --dry-run --Werror

  # ---------------------------------------------------------------------------
  # Fuzz smoke — build the libFuzzer harnesses (clang, ASan+UBSan+fuzzer) and
  # run each for a short bounded time against its seed corpus. A crash, leak, or
  # timeout makes libFuzzer exit non-zero and fails the job. BLOCKING and must
  # stay green: the harnesses only perform contract-VALID operations (see
  # fuzz/README-style header comments), so any finding is a genuine metl defect.
  # Kept fast (5 harnesses x ~25s + a quick clang build, well under 6 min).
  # ---------------------------------------------------------------------------
  fuzz-smoke:
    name: fuzz-smoke
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install build deps
        uses: ./.github/actions/apt-install
        with:
          packages: build-essential clang
          cache-key: build-essential-clang

      - name: Configure (fuzzers on, clang)
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -B build-fuzz -S . \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMETL_BUILD_TESTS=OFF \
            -DMETL_INSTALL=OFF \
            -DMETL_BUILD_DOCS=OFF \
            -DMETL_BUILD_FUZZERS=ON

      - name: Build fuzzers
        run: cmake --build build-fuzz -j

      - name: Run each fuzzer (bounded; fail on crash/leak/timeout)
        env:
          # Abort loudly on any sanitizer finding so libFuzzer records a crash.
          ASAN_OPTIONS: "halt_on_error=1:abort_on_error=1:detect_leaks=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1:abort_on_error=1"
        run: |
          set -euo pipefail
          # Derive the harness list from the built binaries so a newly added
          # fuzzer is picked up automatically — never silently skipped by this
          # blocking gate (the list previously duplicated fuzz/CMakeLists.txt and
          # .clusterfuzzlite/build.sh, a false-green risk).
          shopt -s nullglob
          bins=(build-fuzz/fuzz/metl_fuzz_*)
          if [ "${#bins[@]}" -eq 0 ]; then
            echo "::error::no fuzz binaries were built (expected build-fuzz/fuzz/metl_fuzz_*)"
            exit 1
          fi
          for bin in "${bins[@]}"; do
            t="$(basename "$bin")"; t="${t#metl_}"   # metl_fuzz_crc -> fuzz_crc
            echo "::group::${t}"
            mkdir -p "fuzz/corpus/${t}"
            "$bin" \
              -max_total_time=25 -runs=2000000 -timeout=10 -rss_limit_mb=2048 \
              "fuzz/corpus/${t}"
            echo "::endgroup::"
          done

      - name: Upload crash artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: fuzz-smoke-crashes
          path: |
            crash-*
            leak-*
            timeout-*
            oom-*
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Benchmark smoke — build the micro-benchmarks, run each with --quick, and
  # ratchet the instructions they execute.
  #
  # The wall-clock half is still NOT a gate, for the reason it never was: a
  # threshold on a shared GitHub runner either fires spuriously or is loose
  # enough never to fire, and either way it trains people to ignore it.
  #
  # That argument is about TIME, and until now it had been taken to cover
  # performance as a whole — so six `perf(...)` commits shipped with nothing
  # gating any of them, including #18, whose subject line is "bound lookup
  # latency". An instruction count is not a time: cachegrind returns the same
  # number on a loaded runner and an idle one, because it counts what the
  # program executed rather than how long the machine took. See
  # tools/check_instructions.py for what that does and does not cover.
  # ---------------------------------------------------------------------------
  bench-smoke:
    name: bench-smoke
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install build deps
        uses: ./.github/actions/apt-install
        with:
          packages: build-essential clang valgrind
          cache-key: build-essential-clang-valgrind

      - name: Configure (benchmarks on)
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -B build-bench -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DMETL_BUILD_BENCHMARKS=ON \
            -DMETL_BUILD_TESTS=OFF \
            -DMETL_INSTALL=OFF

      - name: Build
        run: cmake --build build-bench -j

      - name: Run each benchmark (--quick)
        run: ctest --test-dir build-bench -L bench --output-on-failure

      # The wall-clock numbers stay informational, for the reason above.
      #
      # The glob used to be `build-bench/metl_bench_*`, and CMake puts the
      # binaries in `build-bench/bench/`. It therefore matched nothing, `[ -x ]`
      # was false for the unexpanded pattern, and the loop printed no benchmarks
      # and exited 0 -- for however long it had been there. The `shopt -s
      # nullglob` and the count check below are why it cannot happen again: a
      # loop over nothing has to be an error, not a quiet success.
      - name: Show the wall-clock numbers (informational only)
        run: |
          set -euo pipefail
          shopt -s nullglob
          bins=(build-bench/bench/metl_bench_*)
          if [ "${#bins[@]}" -eq 0 ]; then
            echo "::error::no benchmark binaries found under build-bench/bench/"
            exit 1
          fi
          for b in "${bins[@]}"; do
            "$b" --quick
          done

      # ...and the instruction counts are the half that IS gated.
      - name: Instruction ratchet must still bite (canary)
        run: tools/check_instructions.py --self-test

      # ENFORCING. The budgets in tools/check_instructions.py came from this
      # job's own --report output earlier in this PR (run 32612187131) and never
      # from a local figure -- the development machine has a different libc and
      # a different compiler, and local numbers have disagreed with CI
      # repeatedly. Same two-step as check_size.py and check_stack.py.
      #
      # The numbers themselves are not repeated here; that is the mistake #76
      # fixed for the size budgets.
      #
      # --iterations is passed explicitly because a budget is a count of work at
      # ONE iteration count. Changing the tool's default would otherwise compare
      # unrelated numbers and read as a clean 2x regression rather than as a
      # mistake; the checker refuses the mismatch outright.
      #
      # Note what --report would NOT have excused either: a missing valgrind,
      # zero benchmark binaries, a benchmark whose process exits non-zero, and a
      # benchmark whose body was optimised away. Those are the ways this step
      # could become one that only passes -- and the last one was not
      # hypothetical, it caught ring_buffer push+pop twice in this PR.
      - name: Count instructions per benchmark
        run: |
          tools/check_instructions.py \
            --bench-dir build-bench \
            --iterations 5000

  # ---------------------------------------------------------------------------
  # Examples — build every example under -Wall -Wextra -Werror and run them.
  # Each example self-checks and returns non-zero on a broken invariant.
  # ---------------------------------------------------------------------------
  examples:
    name: examples / ${{ matrix.compiler.cc }}
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { cc: gcc, cxx: g++ }
          - { cc: clang, cxx: clang++ }

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install build deps
        uses: ./.github/actions/apt-install
        with:
          packages: build-essential clang
          cache-key: build-essential-clang

      - name: Configure (examples on, warnings as errors)
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMETL_BUILD_TESTS=OFF \
            -DMETL_INSTALL=OFF \
            -DMETL_BUILD_EXAMPLES=ON \
            -DMETL_WARNINGS_AS_ERRORS=ON

      - name: Build examples
        run: cmake --build build -j

      - name: Run examples
        run: ctest --test-dir build -R metl_example --output-on-failure

  # ---------------------------------------------------------------------------
  # Docs — generate Doxygen API docs; fail on malformed doc comments.
  # (Undocumented symbols are tolerated: WARN_IF_UNDOCUMENTED=NO in the
  # Doxyfile. Any real Doxygen warning fails the build via WARN_AS_ERROR.)
  # This job is independent and does not gate the build/test/format jobs.
  # ---------------------------------------------------------------------------
  docs:
    name: docs
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install Doxygen
        uses: ./.github/actions/apt-install
        with:
          packages: doxygen
          cache-key: doxygen

      - name: Configure
        run: cmake -B build -S . -DMETL_BUILD_TESTS=OFF -DMETL_INSTALL=OFF

      - name: Generate API docs (fails on Doxygen warnings)
        run: cmake --build build --target docs

      - name: Upload generated HTML docs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: metl-api-docs
          path: build/docs/html
          if-no-files-found: warn

      # On main, also stage the HTML as a Pages artifact for the deploy-docs job.
      - name: Upload docs as a Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: build/docs/html

  # ---------------------------------------------------------------------------
  # Install check — build, install, consume via find_package(metl)
  # ---------------------------------------------------------------------------
  install-check:
    name: install-check
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install build deps
        uses: ./.github/actions/apt-install
        with:
          packages: build-essential
          cache-key: build-essential

      - name: Configure metl (install enabled)
        env:
          CC: gcc
          CXX: g++
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DMETL_INSTALL=ON

      - name: Build metl
        run: cmake --build build -j --config Release

      - name: Install metl into staging prefix
        run: DESTDIR=$PWD/_install cmake --install build

      - name: Create downstream consumer project
        run: |
          mkdir -p /tmp/consumer
          cat > /tmp/consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.16)
          project(metl_consumer CXX)
          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          find_package(metl REQUIRED)
          add_executable(hello hello.cpp)
          target_link_libraries(hello PRIVATE metl::metl)
          EOF
          cat > /tmp/consumer/hello.cpp <<'EOF'
          #include <metl/optional.hpp>
          #include <cstdio>
          int main() {
              metl::optional<int> v{42};
              std::printf("metl optional value: %d\n", v.value());
              return 0;
          }
          EOF

      - name: Configure consumer against installed metl
        run: |
          cmake -B /tmp/consumer/build -S /tmp/consumer \
            -DCMAKE_PREFIX_PATH=$PWD/_install/usr/local

      - name: Build consumer
        run: cmake --build /tmp/consumer/build -j

      - name: Run consumer
        run: /tmp/consumer/build/hello

  # ---------------------------------------------------------------------------
  # Zephyr module — consume metl as a Zephyr module and build+run a sample.
  #
  # Proves metl is usable as an "interface-only" Zephyr module: the sample app
  # (samples/zephyr/metl_hello) enables CONFIG_METL=y, finds <metl/...> via the
  # module's zephyr/CMakeLists.txt include hook, compiles as C++17 with no
  # exceptions/RTTI, and links against Zephyr's C++ runtime on a Cortex-M target.
  #
  # Approach: run inside the official Zephyr CI Docker image (SDK + west + qemu
  # preinstalled), init a THROWAWAY upstream-Zephyr workspace pinned to the LTS
  # release, then point Zephyr at this checkout via EXTRA_ZEPHYR_MODULES.
  #   1. `west build` for qemu_cortex_m3 — the hard structural gate (compile +
  #      link; very high confidence, correct-by-construction).
  #   2. `twister` build+RUN on qemu_cortex_m3 — launches QEMU and asserts the
  #      sample's "metl on Zephyr: OK" sentinel via the console harness.
  #
  # ITERATION NOTES (flagged because this can't be run locally on macOS):
  #   * Container tag `v0.27.4` pins the Zephyr CI image; bump if the SDK/west
  #     combo it ships can't build the pinned Zephyr (v3.7.0 LTS). `:latest` is
  #     the fallback if the pinned tag is unavailable.
  #   * ZEPHYR_SDK_INSTALL_DIR is provided by the CI image; `west build` should
  #     auto-detect the toolchain. If not, set ZEPHYR_TOOLCHAIN_VARIANT=zephyr.
  #   * If the twister run proves flaky (QEMU exit/semihosting quirks), the
  #     `west build` step above is the guaranteed structural proof; the run can
  #     be narrowed to native_sim or dropped while iterating.
  #   * libc choice lives in the sample prj.conf (CONFIG_REQUIRES_FULL_LIBCPP=y,
  #     the low-risk default). See that file to try minimal libc.
  zephyr:
    name: zephyr / qemu_cortex_m3
    runs-on: ubuntu-22.04
    needs: preflight
    container: ghcr.io/zephyrproject-rtos/ci:v0.27.4
    # metl IS a working Zephyr module (zephyr/module.yml + sample + docs). Both
    # halves are blocking as of 2026-08-21: `west build` proves the module and
    # sample compile for qemu_cortex_m3, and the twister step proves the sample
    # runs on the emulated target and prints its sentinel.
    # Zephyr workspace init + build is slow; give it plenty of headroom.
    timeout-minutes: 60
    env:
      # The CI image ships the SDK here and exports this variable; restate it so
      # CMake's Zephyr toolchain lookup is unambiguous.
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr

    steps:
      - name: Checkout metl
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          path: metl

      - name: Locate the Zephyr SDK
        # The image registers the SDK's CMake package under the image user's HOME,
        # but GitHub Actions overrides HOME to /github/home inside the container,
        # so find_package(Zephyr-sdk) misses it. Point ZEPHYR_SDK_INSTALL_DIR at
        # the SDK directory explicitly instead of relying on the package registry.
        run: |
          set -euo pipefail
          sdk="$(ls -d /opt/toolchains/zephyr-sdk-* 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$sdk" ]; then
            sdk="$(find /opt /root /usr/local -maxdepth 4 -type d -name 'zephyr-sdk-*' 2>/dev/null | sort -V | tail -1 || true)"
          fi
          if [ -z "$sdk" ]; then
            echo "::warning::Zephyr SDK not found in image; find_package(Zephyr-sdk) may still fail"
          else
            echo "Found Zephyr SDK: $sdk"
            echo "ZEPHYR_SDK_INSTALL_DIR=$sdk" >> "$GITHUB_ENV"
          fi

      # west update is the dominant cost of this job. Cache the pinned Zephyr
      # workspace and its modules; the key is tied to the pinned release, so a
      # Zephyr upgrade gets a clean workspace automatically.
      - name: Cache Zephyr west workspace
        id: zephyr-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            zephyrproject/.west
            zephyrproject/zephyr
            zephyrproject/modules
            zephyrproject/bootloader
          key: zephyr-west-v3.7.0-${{ runner.os }}-${{ runner.arch }}

      - name: Initialize a throwaway upstream Zephyr workspace
        if: steps.zephyr-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # Pin upstream Zephyr to the v3.7.0 LTS. qemu_cortex_m3 + native_sim
          # both exist there. Shallow-clone modules to keep the checkout fast.
          west init -m https://github.com/zephyrproject-rtos/zephyr --mr v3.7.0 zephyrproject
          cd zephyrproject
          west update --narrow -o=--depth=1

      - name: Export Zephyr CMake package
        working-directory: zephyrproject
        run: west zephyr-export

      - name: Build the sample for qemu_cortex_m3 (structural gate)
        working-directory: zephyrproject
        run: |
          set -euo pipefail
          west build -b qemu_cortex_m3 \
            -d build-metl \
            "$GITHUB_WORKSPACE/metl/samples/zephyr/metl_hello" \
            -- -DEXTRA_ZEPHYR_MODULES="$GITHUB_WORKSPACE/metl"

      - name: Build + run on QEMU via twister (assert sentinel)
        working-directory: zephyrproject
        # BLOCKING since 2026-08-21. This step tolerated "QEMU/semihosting
        # flakiness" that has not been observed: 12 of the last 12 main runs
        # passed it. The flakiness was anticipated rather than measured, and an
        # anticipated flake is not a reason to stop asserting the one thing this
        # step exists for -- that the sample actually RUNS on the emulated target
        # rather than merely linking for it.
        run: |
          set -euo pipefail
          ./zephyr/scripts/twister -v --inline-logs \
            -p qemu_cortex_m3 \
            -T "$GITHUB_WORKSPACE/metl/samples/zephyr/metl_hello" \
            -x=EXTRA_ZEPHYR_MODULES="$GITHUB_WORKSPACE/metl"

      - name: Upload Zephyr build logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: zephyr-logs
          path: |
            zephyrproject/build-metl/CMakeFiles/CMakeError.log
            zephyrproject/build-metl/CMakeFiles/CMakeOutput.log
            zephyrproject/twister-out/**/build.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # ESP-IDF component — consume metl as a header-only ESP-IDF component and
  # build a sample app for ESP32 (Xtensa) and ESP32-C3 (RISC-V).
  #
  # Proves metl is usable as an interface-only IDF component: the sample app
  # (samples/esp-idf/metl_hello) adds this repo's components/ dir via
  # EXTRA_COMPONENT_DIRS, its `main` component does `REQUIRES metl` to pull in
  # metl's include/ (registered by components/metl/CMakeLists.txt), and
  # main.cpp compiles as C++ (ESP-IDF builds .cpp as C++17+ by default, with
  # exceptions/RTTI OFF — matching metl's contract) and links into the image.
  #
  # The esp32 (Xtensa) target is the key new coverage: it exercises a compiler
  # frontend/target not touched by any other job (ARM, RISC-V, x86, PPC64).
  # esp32c3 additionally covers the RISC-V ESP variant.
  #
  # Approach: the official espressif/esp-idf-ci-action runs `idf.py build`
  # inside the pinned espressif/idf Docker image — no manual toolchain install.
  #
  # ITERATION NOTES (flagged because this can't be run locally on macOS):
  #   * esp_idf_version pins the espressif/idf Docker tag. v5.3.3 is an exact
  #     patch pin (reproducible); `release-v5.3` (release branch) or `v5.3`
  #     (rolling minor) are moving alternatives if the exact tag is unavailable.
  #   * The action inputs are exactly: path, esp_idf_version, target, command
  #     (default command is `idf.py build`). There is no extra_docker_args input.
  #   * `target` sets IDF_TARGET; the matrix covers esp32 (Xtensa) + esp32c3
  #     (RISC-V). Add esp32s3/esp32c6/... by extending the matrix.
  #   * C++: ESP-IDF compiles .cpp as C++ automatically (default std is newer
  #     than C++17, so no CONFIG is needed for metl's C++17 surface); exceptions
  #     and RTTI are OFF by default, which is exactly metl's contract.
  #
  # BLOCKING since 2026-08-21. This job carried `continue-on-error: true` with the
  # reason "the Docker-based build wiring can't be validated locally". That reason
  # expired: CI has validated it 24 times out of 24 (both targets across the last
  # twelve main runs) with no failing step. A job that is green every time and
  # still cannot fail the pipeline is not evidence of anything — it reads as
  # covered while proving nothing, which is the failure mode this repo keeps
  # finding in itself. If it starts flaking, fix the flake or state the reason
  # here; do not put the flag back silently.
  esp-idf:
    name: esp-idf / ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # esp32 = Xtensa (the truly-new frontend), esp32c3 = RISC-V.
        target: [esp32, esp32c3]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Build the metl sample with ESP-IDF (${{ matrix.target }})
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          # Exact patch pin for reproducibility; see ITERATION NOTES above for
          # moving alternatives (release-v5.3 / v5.3).
          esp_idf_version: v5.3.3
          target: ${{ matrix.target }}
          path: samples/esp-idf/metl_hello

  # ---------------------------------------------------------------------------
  # Deploy the Doxygen API docs to GitHub Pages.
  # Runs only on push to main, and only AFTER the docs build and the core
  # validation (host matrix + sanitizers) pass — so we never publish docs for a
  # broken build. A dependency, not a parallel fan-out.
  # ---------------------------------------------------------------------------
  deploy-docs:
    name: deploy-docs
    needs: [docs, host-test, sanitizers]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5
