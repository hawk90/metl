name: ClusterFuzzLite PR

# Per-PR fuzzing with the OSS-Fuzz toolchain, run directly in GitHub Actions via
# ClusterFuzzLite (no upstream registration required). Builds the harnesses from
# .clusterfuzzlite/ and fuzzes the code touched by the PR for a short bounded
# time.
#
# THIS JOB BLOCKS. It used to be continue-on-error, on the stated grounds that
# the Docker-based build wiring could not be validated on the maintainer's
# machine. Its own history disproved that: across twenty consecutive runs of
# this workflow and cflite-batch, zero steps failed. It has been validating
# itself on every PR the whole time -- nobody was reading the result, because
# the job could not report one.
#
# It also stays READ-ONLY. It reads the corpus the nightly batch run grows, and
# must not be able to write to it: a PR's token writing to the corpus branch
# would let an untrusted change poison every later run. The corpus is read from
# git -- the `clusterfuzzlite` branch cflite-batch.yml pushes to -- so both
# ClusterFuzzLite steps below are given the same storage-repo; see the run step
# for why leaving it out is not a harmless default.
on:
  pull_request:
    branches: [main]

# A new push to the PR supersedes the fuzzing of the old commit, so cancel it --
# the same rule as ci.yml and codeql.yml. Without this, every push to a stack of
# PRs left two 30-minute jobs per PR queued for runners nobody would read.
concurrency:
  group: cflite-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# bash -eo pipefail for every run step (tools/check_ci_gate.py G6).
defaults:
  run:
    shell: bash

jobs:
  fuzzing:
    name: cflite-pr
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    steps:
      # A documentation-only pull request changes no code to fuzz. The job
      # still runs and reports -- both `cflite-pr (...)` contexts are required
      # checks -- but skips the build and the fuzzing. ClusterFuzzLite fetches
      # the source itself and its documented workflow has no checkout step, so
      # the classification uses a checkout of its own in a side directory and
      # removes it: the workspace the fuzzing steps see is unchanged.
      - name: Checkout (classification only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 2
          path: .classify-change

      - name: Classify the change
        id: classify
        uses: ./.classify-change/.github/actions/classify-change
        with:
          path: .classify-change

      - name: Remove the classification checkout
        run: rm -rf .classify-change

      - name: Build fuzzers (${{ matrix.sanitizer }})
        id: build
        if: steps.classify.outputs.code == 'true'
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: c++
          sanitizer: ${{ matrix.sanitizer }}
          # Cache prior corpora to accelerate PR runs when available.
          storage-repo: https://github.com/${{ github.repository }}.git
          storage-repo-branch: clusterfuzzlite
          storage-repo-branch-coverage: clusterfuzzlite-coverage

      # On a reproducible crash, code-change mode asks whether the crash is new
      # by downloading a "previous build" -- from GitHub artifacts, even with a
      # git storage-repo, and for up to three commits, each lookup listing every
      # artifact in the repository through the same unbounded pager described
      # below. No such build exists: nothing here uploads one (upload-build is
      # off). The lookup is skipped when the previous-build directory already
      # exists, and an empty one leaves the target missing, which ClusterFuzzLite
      # reports as a new crash -- the same verdict it reaches today after the
      # listings fail to find the build. So create it, and the crash path makes
      # no artifact-list calls at all.
      - name: Skip the previous-build lookup
        if: steps.classify.outputs.code == 'true'
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/cifuzz-prev-build"

      - name: Run fuzzers (${{ matrix.sanitizer }})
        id: run
        if: steps.classify.outputs.code == 'true'
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 120
          mode: 'code-change'
          sanitizer: ${{ matrix.sanitizer }}
          output-sarif: true
          # The storage repo is what makes this run start from the nightly
          # corpus. Without it ClusterFuzzLite falls back to GitHub artifacts and
          # looks for a `cifuzz-corpus-<target>` artifact that nothing creates
          # (the batch run stores the corpus in git), so every target fuzzed from
          # an empty corpus. Worse, the fallback finds that out by listing every
          # artifact in the repository, per target and per sanitizer, with a
          # pager that keeps requesting pages until it has seen the total count
          # from page one -- when the list comes up short of that count it asks
          # for empty pages without end. One run did that ~4,700 times until the
          # API rate limit stopped it, and the exhausted budget failed CodeQL on
          # every PR for the next hour.
          #
          # Read-only and unauthenticated: the repository is public, so the
          # clone and fetches need no token, and code-change mode never pushes
          # (only batch and prune upload a corpus, only coverage uploads a
          # report). Unlike cflite-batch.yml, no token goes in the URL, so a
          # push could not authenticate even if one were attempted.
          storage-repo: https://github.com/${{ github.repository }}.git
          storage-repo-branch: clusterfuzzlite
          storage-repo-branch-coverage: clusterfuzzlite-coverage
