name: ClusterFuzzLite PR

# Per-PR fuzzing with the OSS-Fuzz toolchain, run directly in GitHub Actions via
# ClusterFuzzLite (no upstream registration required). Builds the harnesses from
# .clusterfuzzlite/ and fuzzes the code touched by the PR for a short bounded
# time.
#
# THIS JOB BLOCKS. It used to be continue-on-error, on the stated grounds that
# the Docker-based build wiring could not be validated on the maintainer's
# machine. Its own history disproved that: across twenty consecutive runs of
# this workflow and cflite-batch, zero steps failed. It has been validating
# itself on every PR the whole time -- nobody was reading the result, because
# the job could not report one.
#
# It also stays READ-ONLY. It reads the corpus the nightly batch run grows, and
# must not be able to write to it: a PR's token writing to the corpus branch
# would let an untrusted change poison every later run.
on:
  pull_request:
    branches: [main]

# A new push to the PR supersedes the fuzzing of the old commit, so cancel it --
# the same rule as ci.yml and codeql.yml. Without this, every push to a stack of
# PRs left two 30-minute jobs per PR queued for runners nobody would read.
concurrency:
  group: cflite-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzzing:
    name: cflite-pr
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    steps:
      # A documentation-only pull request changes no code to fuzz. The job
      # still runs and reports -- both `cflite-pr (...)` contexts are required
      # checks -- but skips the build and the fuzzing. ClusterFuzzLite fetches
      # the source itself and its documented workflow has no checkout step, so
      # the classification uses a checkout of its own in a side directory and
      # removes it: the workspace the fuzzing steps see is unchanged.
      - name: Checkout (classification only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 2
          path: .classify-change

      - name: Classify the change
        id: classify
        uses: ./.classify-change/.github/actions/classify-change
        with:
          path: .classify-change

      - name: Remove the classification checkout
        run: rm -rf .classify-change

      - name: Build fuzzers (${{ matrix.sanitizer }})
        id: build
        if: steps.classify.outputs.code == 'true'
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: c++
          sanitizer: ${{ matrix.sanitizer }}
          # Cache prior corpora to accelerate PR runs when available.
          storage-repo: https://github.com/${{ github.repository }}.git
          storage-repo-branch: clusterfuzzlite
          storage-repo-branch-coverage: clusterfuzzlite-coverage

      - name: Run fuzzers (${{ matrix.sanitizer }})
        id: run
        if: steps.classify.outputs.code == 'true'
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 120
          mode: 'code-change'
          sanitizer: ${{ matrix.sanitizer }}
          output-sarif: true
