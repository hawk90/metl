name: ClusterFuzzLite PR

# Per-PR fuzzing with the OSS-Fuzz toolchain, run directly in GitHub Actions via
# ClusterFuzzLite (no upstream registration required). Builds the harnesses from
# .clusterfuzzlite/ and fuzzes the code touched by the PR for a short bounded
# time.
#
# THIS JOB BLOCKS. It used to be continue-on-error, on the stated grounds that
# the Docker-based build wiring could not be validated on the maintainer's
# machine. Its own history disproved that: across twenty consecutive runs of
# this workflow and cflite-batch, zero steps failed. It has been validating
# itself on every PR the whole time -- nobody was reading the result, because
# the job could not report one.
#
# It also stays READ-ONLY. It reads the corpus the nightly batch run grows, and
# must not be able to write to it: a PR's token writing to the corpus branch
# would let an untrusted change poison every later run.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fuzzing:
    name: cflite-pr
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    steps:
      - name: Build fuzzers (${{ matrix.sanitizer }})
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: c++
          sanitizer: ${{ matrix.sanitizer }}
          # Cache prior corpora to accelerate PR runs when available.
          storage-repo: https://github.com/${{ github.repository }}.git
          storage-repo-branch: clusterfuzzlite
          storage-repo-branch-coverage: clusterfuzzlite-coverage

      - name: Run fuzzers (${{ matrix.sanitizer }})
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 120
          mode: 'code-change'
          sanitizer: ${{ matrix.sanitizer }}
          output-sarif: true
