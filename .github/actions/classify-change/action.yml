name: Classify the change
description: >
  code=false for a pull request that touches only Markdown and LICENSE,
  code=true for anything else and for every non-PR event. One definition for
  every workflow that skips work on documentation-only pull requests.

# Needs a checkout with fetch-depth: 2: tools/classify_change.py diffs the
# pull request's merge commit against its first parent, the base branch tip.
# (fetch-depth: 0 would also pull the fuzz-corpus branches.)

inputs:
  path:
    description: Directory holding the checkout to classify.
    required: false
    default: .

outputs:
  code:
    description: "'true' when anything other than Markdown/LICENSE changed"
    value: ${{ steps.classify.outputs.code }}

runs:
  using: composite
  steps:
    - name: Classify the change
      id: classify
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        CHECKOUT: ${{ inputs.path }}
      # The rule, and why a rename counts as code, live in the tool: it has a
      # --self-test that the pre-push hook runs.
      run: python3 "${CHECKOUT}/tools/classify_change.py" --event "${EVENT}" --repo "${CHECKOUT}"
