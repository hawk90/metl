name: Install apt packages with cache and retry
description: Cache downloaded Debian packages and tolerate transient apt failures

# The failure this exists to fix is a *stall*, not an error. The cross-toolchain
# jobs install gcc-arm-none-eabi, a 574 MB download that normally takes ~35 s;
# when Ubuntu's Azure mirror wedges, `apt-get` simply stops making progress and
# never returns. On 2026-08-19 that burned the whole `timeout-minutes: 15`
# budget in five separate jobs, which GitHub reports as `cancelled` rather than
# `timed_out` -- so the run looked like a concurrency cancellation.
#
# A bare retry loop does nothing against that: the command never exits, so the
# loop never reaches its next iteration. Two things fix it, in this order:
#
#   1. `Acquire::*::Timeout` makes *apt* give up on a stalled socket instead of
#      waiting forever, and `Acquire::Retries` lets it re-try the fetch itself.
#      This is the real fix -- it recovers without losing the packages already
#      downloaded.
#   2. The outer `timeout` is only a backstop for a hang apt's own timeouts do
#      not cover.
#
# The retry budget must stay *under* the calling job's `timeout-minutes`, or
# the retries eat the job rather than saving it. That is how the first version
# of this action failed: three attempts at up to 20 minutes each, inside a job
# budgeted at 10, so attempt 2 was still running when the job died -- and with
# no output flushed, it looked like a hang with no diagnosis. The loop below is
# bounded by a single deadline (default 8 minutes, under every job budget here)
# and always reports why it gave up.
#
# Do NOT add `--no-install-recommends` here. `libnewlib-arm-none-eabi` and the
# `libstdc++-arm-none-eabi-*` packages are Recommends of `gcc-arm-none-eabi`,
# not Depends, so the flag removes the freestanding C++ standard headers and
# every cross build dies on `fatal error: cstdint: No such file or directory`.
# A default `apt-get install` log does not reveal this -- it folds recommends
# into "The following additional packages will be installed" and prints no
# "Recommended packages:" section at all, so their absence there is not
# evidence that there are none.

inputs:
  packages:
    description: Space-separated apt package names
    required: true
  cache-key:
    description: Stable cache namespace for this package set
    required: true
  total-timeout:
    description: >
      Hard ceiling in seconds for all attempts combined. Must be less than the
      calling job's timeout-minutes so a wedged mirror fails with a message
      instead of consuming the job.
    required: false
    default: "480"

runs:
  using: composite
  steps:
    # Cache a RUNNER-OWNED directory, never /var/cache/apt/archives directly.
    #
    # The obvious version of this -- `path: /var/cache/apt/archives/*.deb` --
    # looks right and never worked. actions/cache runs its tar as `runner`, and
    # every .deb there is root:root 0644, so the SAVE fails with
    # "Cannot open: Permission denied" and the restore then finds nothing:
    #
    #   ##[warning]Failed to restore: "/usr/bin/tar" failed with exit code 2
    #   Cache not found for input keys: apt-Linux-X64-gcc-arm-none-eabi
    #
    # It failed that way in 47 of 55 jobs on run 32435781000 -- and those were
    # the only warnings in the entire run. So every cross job has been
    # re-downloading the 574 MB toolchain on every push since this action
    # landed, which is exactly the exposure the timeouts below exist to survive.
    # An earlier comment here noted that `partial/` is 0700 root:root and
    # narrowed the path to the .deb files; that was one step short, because the
    # .debs are unreadable to the runner too.
    # The image release (ImageOS: ubuntu24, ubuntu26, ...) is part of the key:
    # runner.os is only "Linux", so without it a runner-image upgrade would
    # restore the previous release's .debs and never save its own.
    - name: Identify the runner image
      id: image
      shell: bash
      run: echo "os=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"

    # The key names the CONTENTS, not just the package set. A fixed key
    # (`apt-<os>-<arch>-<set>`) is a hit forever, and actions/cache never saves
    # on a hit, so the cache stayed exactly as first saved: every one was dated
    # 2026-10-05 or 2026-10-18 a month later. Each package Ubuntu updated since
    # was downloaded again in every job -- 18.3 MB of qemu 1:10.2.1+ds-1ubuntu3.3
    # in each of the 12 qemu jobs -- and on the nightly of 2026-11-05 the mirror
    # served that at 41.6 kB/s, 7 min 19 s, past the 480 s budget.
    #
    # So restore by prefix (the newest cache of this set), and after the install
    # name the .debs apt actually holds; when that name differs from what was
    # restored, save under it. `@` ends the prefix because set names are
    # prefixes of one another (build-essential, build-essential-clang, ...).
    #
    # Must be >= v4.2.0: GitHub closed down the cache service API that
    # actions/cache v4.1.x and earlier used, and hard-fails any job that calls
    # it. A SHA that resolves to a real tag is not enough here.
    - name: Restore apt archives
      id: apt-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ~/.cache/metl-apt
        key: apt-${{ steps.image.outputs.os }}-${{ runner.arch }}-${{ inputs.cache-key }}@
        restore-keys: apt-${{ steps.image.outputs.os }}-${{ runner.arch }}-${{ inputs.cache-key }}@

    - name: Install apt packages (bounded retry)
      id: install
      shell: bash
      env:
        APT_PACKAGES: ${{ inputs.packages }}
        APT_TOTAL_TIMEOUT: ${{ inputs.total-timeout }}
        APT_CACHE_MATCHED: ${{ steps.apt-cache.outputs.cache-matched-key }}
        APT_KEY_PREFIX: apt-${{ steps.image.outputs.os }}-${{ runner.arch }}-${{ inputs.cache-key }}@
      run: |
        set -euo pipefail

        # apt deletes the .debs it just installed unless told otherwise, which
        # would leave nothing for the post-run cache save to pick up.
        echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
          | sudo tee /etc/apt/apt.conf.d/99keep-downloads > /dev/null

        # dpkg fsyncs every unpacked file; the ARM toolchain is thousands of
        # them, and that was most of the 27-38 s a cached install still took.
        # A runner is thrown away after the job, so there is no crash to
        # survive.
        echo force-unsafe-io | sudo tee /etc/dpkg/dpkg.cfg.d/99unsafe-io > /dev/null

        CACHE_DIR="${HOME}/.cache/metl-apt"
        mkdir -p "${CACHE_DIR}"

        # Hand the cached packages to apt so `install` finds them already
        # downloaded. This is the whole point of the cache; the log line is how
        # anyone can tell it worked without reading the timings.
        if compgen -G "${CACHE_DIR}/*.deb" > /dev/null; then
          sudo cp "${CACHE_DIR}"/*.deb /var/cache/apt/archives/
          echo "apt cache: seeded $(find "${CACHE_DIR}" -name '*.deb' | wc -l | tr -d ' ') package(s)"
        elif [[ -n "${APT_CACHE_MATCHED}" ]]; then
          # A hit that restores nothing is how this broke the first time, and it
          # was invisible for months because it was only a warning. Make it a
          # failure so it cannot be silent twice.
          echo "::error::apt cache reported a hit but restored no .deb files."
          echo "::error::The cache is broken again -- check the tar step's output."
          exit 1
        else
          echo "apt cache: cold (nothing restored; this run will populate it)"
        fi

        # Make apt itself fail a stalled socket rather than waiting forever,
        # and re-fetch on its own before we throw the whole attempt away.
        APT_OPTS=(
          -o Acquire::Retries=3
          -o Acquire::http::Timeout=30
          -o Acquire::https::Timeout=30
          -o Acquire::ftp::Timeout=30
        )

        # Where this step's entries in dpkg's log begin (see the cache staging
        # below). A failed attempt's partial unpacks are this step's too.
        dpkg_mark=$(wc -l < /var/log/dpkg.log 2>/dev/null || echo 0)

        deadline=$(( SECONDS + APT_TOTAL_TIMEOUT ))
        attempt=0
        while (( SECONDS < deadline )); do
          attempt=$(( attempt + 1 ))
          remaining=$(( deadline - SECONDS ))
          echo "apt attempt ${attempt} (${remaining}s of budget left)"

          # `update` gets a slice, `install` whatever is still left, so a slow
          # index refresh cannot starve the download it exists to enable.
          updated=0
          # `timeout 0` means NO limit, so a budget used up by `update` must stop
          # the attempt rather than start an unbounded install.
          if timeout $(( remaining / 4 + 1 )) sudo apt-get "${APT_OPTS[@]}" update && \
             updated=1 && \
             (( deadline - SECONDS > 0 )) && \
             timeout $(( deadline - SECONDS )) \
               sudo apt-get "${APT_OPTS[@]}" install -y ${APT_PACKAGES}; then
            # Cache what THIS install unpacked -- dpkg's own record of it -- not
            # whatever sits in the archive directory. An earlier step's apt run
            # leaves its .debs there too (ccache-action's ccache, libfmt10 and
            # libhiredis1.1.0), so hashing the directory gave one package set a
            # different key per job, and each run would save it again. Taking
            # the installed versions also leaves out the ones an update
            # replaced, so old versions do not pile up in the cache.
            # dpkg.log: "<date> <time> install|upgrade <pkg>:<arch> <old> <new>";
            # the .deb is <pkg>_<new, ':' as %3a>_<arch>.deb -- but match any
            # arch: the runner fetches from the amd64v3 archive, so dpkg's
            # `amd64` is `qemu-system-arm_1%3a10.2.1+ds-1ubuntu3.3_amd64v3.deb`.
            wanted="$(tail -n +$(( dpkg_mark + 1 )) /var/log/dpkg.log \
              | awk '$3 == "install" || $3 == "upgrade" {
                       split($4, p, ":"); v = $6; gsub(":", "%3a", v)
                       print p[1] "_" v "_" }' \
              | LC_ALL=C sort -u)"
            names=""
            missing=""
            for stem in ${wanted}; do
              found="$(find /var/cache/apt/archives -maxdepth 1 -name "${stem}*.deb" -printf '%f\n')"
              if [[ -n "${found}" ]]; then
                names+="${found}"$'\n'
              else
                missing+=" ${stem}"
              fi
            done
            names="$( (grep . <<< "${names}" || true) | LC_ALL=C sort -u)"
            if [[ -n "${missing}" ]]; then
              # Not fatal -- the install worked -- but the next run downloads
              # these again, so say which.
              echo "::warning::installed but no .deb in the apt archive to cache:${missing}"
            fi
            if [[ -z "${names}" ]]; then
              echo "apt cache: nothing to save (this install unpacked no .deb)"
              exit 0
            fi
            key="${APT_KEY_PREFIX}$(sha256sum <<< "${names}" | cut -c1-16)"
            if [[ "${key}" == "${APT_CACHE_MATCHED}" ]]; then
              echo "apt cache: up to date (${key})"
              exit 0
            fi
            # Stage exactly this set somewhere the save step can read: `sudo cp`
            # lands the files root-owned, so chown before leaving.
            find "${CACHE_DIR}" -maxdepth 1 -name '*.deb' -delete
            while read -r deb; do
              [[ -n "${deb}" ]] && sudo cp "/var/cache/apt/archives/${deb}" "${CACHE_DIR}/"
            done <<< "${names}"
            sudo chown -R "$(id -u):$(id -g)" "${CACHE_DIR}"
            echo "apt cache: staged $(grep -c . <<< "${names}") package(s) as ${key}" \
                 "(restored: ${APT_CACHE_MATCHED:-nothing})"
            echo "key=${key}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "apt attempt ${attempt} failed or timed out" >&2

          # A package with no candidate on a freshly updated index is a rename
          # or a removal in this Ubuntu release, not a flaky mirror: retrying
          # cannot fix it. (qemu-user-static on 26.04 retried 77 times for the
          # full 480 s before this check existed.)
          if (( updated )); then
            missing=""
            for package in ${APT_PACKAGES}; do
              candidate="$(apt-cache policy "${package}" 2>/dev/null | awk '/Candidate:/ {print $2}')"
              if [[ -z "${candidate}" || "${candidate}" == "(none)" ]]; then
                missing="${missing} ${package}"
              fi
            done
            if [[ -n "${missing}" ]]; then
              echo "::error::no installable candidate on this image for:${missing}." \
                   "Renamed or removed in this release -- not a mirror problem."
              exit 1
            fi
          fi
          sleep 5
        done

        echo "apt did not succeed within ${APT_TOTAL_TIMEOUT}s (${attempt} attempts)." >&2
        echo "If only the cross-toolchain jobs are affected, suspect the Ubuntu mirror." >&2
        exit 1

    # Not on pull requests: a cache saved there is visible only to that pull
    # request, so it would spend the repository's 10 GB on a set nothing else
    # restores. Runs on main (push, nightly, dispatch) refresh it for everyone.
    # Jobs that share a set race to save the same key; the losers only warn.
    - name: Save apt archives
      if: steps.install.outputs.key != '' && github.event_name != 'pull_request'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ~/.cache/metl-apt
        key: ${{ steps.install.outputs.key }}
