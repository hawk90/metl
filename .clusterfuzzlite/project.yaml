# ClusterFuzzLite project configuration for metl.
# https://google.github.io/clusterfuzzlite/
#
# metl is a header-only C++17 library; the harnesses live in fuzz/ and are
# compiled directly against include/ by .clusterfuzzlite/build.sh.
#
# THIS IS NOT AN OSS-FUZZ SUBMISSION, and the note that used to sit here calling
# it "a drop-in follow-up" was wrong twice over.
#
#   1. The file is incomplete for OSS-Fuzz. Their new-project guide requires
#      `homepage` and `primary_contact` (an email address, in a public file in
#      the google/oss-fuzz repository); neither is here, and adding the second
#      is a maintainer's decision, not a mechanical edit.
#   2. OSS-Fuzz is not open to every project. The stated bar is that a project
#      "must have a significant user base and/or be critical to the global IT
#      infrastructure". METL is pre-1.0 with no known dependents. Submitting
#      anyway spends a reviewer's time on a decision that is already knowable.
#
# The Dockerfile and build.sh ARE the right shape, and this workflow exercises
# them on every PR, so the mechanical part is genuinely ready. What is not ready
# is the project. Revisit when there are users to point at.
#
# (The Dockerfile's `FROM gcr.io/oss-fuzz-base/base-builder` is deliberately
# untagged: OSS-Fuzz's docs specify exactly that form, and their infrastructure
# rebuilds against a moving base image. Pinning it would score better on
# supply-chain checks and break the thing it is for.)
language: c++
main_repo: "https://github.com/hawk90/metl"
sanitizers:
  - address
  - undefined
fuzzing_engines:
  - libfuzzer
