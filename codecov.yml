# Codecov displays METL's coverage; it does not gate it. The gate is
# tools/coverage.py's line and branch floors in the `coverage` CI job, measured
# by one pinned Clang. A second, differently computed threshold here would be a
# second source of truth, so every Codecov status is informational.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "header, diff, files"
  behavior: default
  require_changes: true
