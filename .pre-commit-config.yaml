# Local pre-commit hooks so a contributor's formatting matches CI exactly.
#
#   pipx install pre-commit      # or: pip install pre-commit
#   pre-commit install           # clang-format on commit, local CI on push
#   pre-commit run --all-files   # one-off over the whole tree
#
# The pre-push hook is tools/pre_push.py: every CI check that can run on a
# workstation (checker self-tests, the source gates, Release -Werror builds with
# each compiler found, ASan+UBSan), before the push leaves the machine.
# `git push --no-verify` skips it; CI still runs everything.
#
# The clang-format revision is pinned to the SAME version the CI `clang-format`
# job enforces (.github/workflows/ci.yml). Keep the two in lockstep — bumping one
# without the other reintroduces the local-vs-CI formatting mismatch this file
# exists to prevent.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.2
    hooks:
      - id: clang-format
        files: \.(hpp|cpp|h)$

  - repo: local
    hooks:
      - id: metl-pre-push
        name: local CI checks (tools/pre_push.py)
        entry: python3 tools/pre_push.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
